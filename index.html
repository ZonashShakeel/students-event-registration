<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #eef2f7; }
    #regCard { max-width: 520px; margin: 30px auto; transition: all 0.4s; }
    #message { min-height: 30px; }
    pre { background: #212529; color: #0f0; padding: 15px; max-height: 500px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <div class="card shadow" id="regCard">
    <div class="card-body">

      <h2 id="cardTitle" class="card-title text-primary">Tech Fest 2026</h2>
      <p class="card-text">Join the UET Mardan annual event. Register your seat below!</p>

      <button id="btnInstructions" class="btn btn-outline-secondary btn-sm mb-2">Show / Hide Instructions</button>
      <div id="instructions" class="alert alert-info">
        1. Enter your name and email.<br>
        2. Choose an event.<br>
        3. Click Register.
      </div>

      <button id="btnDetails" class="btn btn-outline-info btn-sm mb-2">Event Details (slide)</button>
      <div id="details" class="alert alert-warning" style="display:none;">
        Venue: Main Auditorium<br>Time: 10:00 AM<br>Entry: Free
      </div>

      <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" id="studentName" class="form-control" placeholder="Enter your name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="studentEmail" class="form-control" placeholder="Enter your email">
      </div>
      <div class="mb-3">
        <label class="form-label">Select Event</label>
        <select id="eventSelect" class="form-select">
          <option value="Coding Contest">Coding Contest</option>
          <option value="Robotics Workshop">Robotics Workshop</option>
          <option value="AI Seminar">AI Seminar</option>
        </select>
      </div>

      <button id="btnRegister" class="btn btn-primary">Register</button>
      <button id="btnColor" class="btn btn-success">Change Color</button>

      <div id="message" class="mt-3"></div>

      <h6 class="mt-3">Registered Students:</h6>
      <ul id="regList" class="list-group"></ul>

    </div>
  </div>

  <h4 class="text-center">Complete Source Code</h4>
  <pre id="codeBox">Loading code...</pre>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  // ---------- PLAIN JAVASCRIPT ----------
  var colors = ["#dc3545", "#198754", "#6f42c1", "#fd7e14", "#0d6efd"];
  var colorIndex = 0;

  document.getElementById("btnRegister").addEventListener("click", function () {
    var name = document.getElementById("studentName").value.trim();
    var email = document.getElementById("studentEmail").value.trim();
    var event = document.getElementById("eventSelect").value;
    var msg = document.getElementById("message");

    if (name === "" || email === "") {
      msg.innerHTML = '<div class="alert alert-danger">Error: Please fill in both name and email!</div>';
      return;
    }
    msg.innerHTML = '<div class="alert alert-success">Thank you, <b>' + name +
      '</b>! You are registered for <b>' + event + '</b>.</div>';

    $("#regList").append('<li class="list-group-item">' + name + ' - ' + event + '</li>');
    $("#regList li:last").hide().fadeIn(800);
  });

  document.getElementById("btnColor").addEventListener("click", function () {
    var c = colors[colorIndex % colors.length];
    document.getElementById("cardTitle").style.color = c;
    document.getElementById("regCard").style.backgroundColor = "#f8f9fa";
    document.getElementById("regCard").style.borderColor = c;
    document.getElementById("regCard").style.borderWidth = "3px";
    colorIndex++;
  });

  // ---------- JQUERY ----------
  $(document).ready(function () {
    $("#btnInstructions").click(function () {
      $("#instructions").toggle();
    });

    $("#btnDetails").click(function () {
      $("#details").slideToggle(500);
    });

    $("#btnRegister").mouseover(function () {
      $(this).css("background-color", "#ff9800");
    }).mouseout(function () {
      $(this).css("background-color", "");
    });
  });
</script>

<!-- SHOW SOURCE CODE (keep this last) -->
<script>
  window.addEventListener("load", function () {
    var box = document.getElementById("codeBox");

    function showBackup() {
      box.textContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    }

    // Method 1: get the real file (works on Vercel)
    fetch(window.location.href)
      .then(function (r) { return r.text(); })
      .then(function (t) { box.textContent = t; })
      .catch(showBackup);   // Method 2: works when double-clicking the file
  });
</script>
</body>
</html>
